services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "23:2223"
      - "2222:2222"
    volumes:
      - /opt/cowrie/log:/cowrie/cowrie-git/var/log/cowrie
      - /opt/cowrie/downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - /opt/cowrie/etc:/cowrie/cowrie-git/etc
    networks:
      cowrie_net:
        ipv4_address: 172.20.0.10

networks:
  cowrie_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
